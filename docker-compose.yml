services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikatan_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sikatan_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: sikatan_web
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sikatan_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sikatan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sikatan_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sikatan_user
      MYSQL_PASSWORD: sikatan_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sikatan_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sikatan_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8006:80"
    networks:
      - sikatan_network
    depends_on:
      - db

networks:
  sikatan_network:
    driver: bridge

volumes:
  db_data:
    driver: local
