services:
  webburung-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webburung-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - shared-network

  webburung-web:
    image: nginx:alpine
    container_name: webburung-web
    restart: unless-stopped
    ports:
      - "8005:80" 
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shared-network

networks:
  shared-network:
    external: true